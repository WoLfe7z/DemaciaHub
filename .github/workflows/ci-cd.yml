name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Starejse zagone na istem PR-ju prekine, zagonov na main pa ne
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: 22

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Namestitev odvisnosti (ESLint)
        run: npm ci

      - name: ESLint (frontend in backend)
        run: npm run lint

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Gradnja frontenda in backenda
        run: npm run build

      - name: Preverjanje paketa (odvisnosti se naložijo)
        run: node -e "['authRoutes','teamRoutes','tournamentRoutes'].forEach((r) => require('./dist/backend/routes/' + r))"

      - name: Priprava zip paketa
        run: cd dist && zip -qr ../app.zip .

      - name: Shranjevanje artefakta
        uses: actions/upload-artifact@v4
        with:
          name: app-package
          path: app.zip
          if-no-files-found: error
          retention-days: 7

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Namestitev odvisnosti (backend)
        run: npm ci
        working-directory: backend

      - name: Testi backenda
        run: npm test
        working-directory: backend

      - name: Namestitev odvisnosti (frontend)
        run: npm ci
        working-directory: frontend

      - name: Testi frontenda
        run: npm test
        working-directory: frontend

      - name: Shranjevanje porocila o pokritosti
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            backend/coverage
            frontend/coverage
          retention-days: 7

  deploy:
    name: deploy
    needs: [lint, build, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.webapp-url }}
    steps:
      # Aplikacija se zažene znova
      - name: Prenos artefakta
        uses: actions/download-artifact@v4
        with:
          name: app-package

      - name: Namestitev na Azure App Service
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: app.zip
